  <feGaussianBlur in="lumA" stdDeviation="1.2" result="lumB"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="dome"/>
  <feComposite in="dome" in2="lumB" operator="arithmetic" k2="0.80" k3="0.4" result="h0"/>
  <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="5" result="nz"/><feComposite in="h0" in2="nz" operator="arithmetic" k2="1" k3="0.06" result="h"/>

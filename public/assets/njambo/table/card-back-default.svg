      <line x1="154.6" y1="159.6" x2="158.4" y2="160.7" stroke-width="0.8" />
      <line x1="146.8" y1="172.0" x2="152.4" y2="175.3" stroke-width="1.3" />
      <line x1="140.0" y1="185.0" x2="142.8" y2="187.8" stroke-width="0.8" />
      <line x1="127.0" y1="191.8" x2="130.3" y2="197.4" stroke-width="1.3" />
      <line x1="114.6" y1="199.6" x2="115.7" y2="203.4" stroke-width="0.8" />
      <line x1="100.0" y1="199.0" x2="100.0" y2="205.5" stroke-width="1.3" />
      <line x1="85.4" y1="199.6" x2="84.3" y2="203.4" stroke-width="0.8" />
      <line x1="73.0" y1="191.8" x2="69.7" y2="197.4" stroke-width="1.3" />
      <line x1="60.0" y1="185.0" x2="57.2" y2="187.8" stroke-width="0.8" />
      <line x1="53.2" y1="172.0" x2="47.6" y2="175.3" stroke-width="1.3" />
      <line x1="45.4" y1="159.6" x2="41.6" y2="160.7" stroke-width="0.8" />
      <line x1="46.0" y1="145.0" x2="39.5" y2="145.0" stroke-width="1.3" />
      <line x1="45.4" y1="130.4" x2="41.6" y2="129.3" stroke-width="0.8" />
      <line x1="53.2" y1="118.0" x2="47.6" y2="114.7" stroke-width="1.3" />
      <line x1="60.0" y1="105.0" x2="57.2" y2="102.2" stroke-width="0.8" />
      <line x1="73.0" y1="98.2" x2="69.7" y2="92.6" stroke-width="1.3" />
      <line x1="85.4" y1="90.4" x2="84.3" y2="86.6" stroke-width="0.8" />
      <line x1="100.0" y1="91.0" x2="100.0" y2="84.5" stroke-width="1.3" />
      <line x1="114.6" y1="90.4" x2="115.7" y2="86.6" stroke-width="0.8" />
      <line x1="127.0" y1="98.2" x2="130.3" y2="92.6" stroke-width="1.3" />
      <line x1="140.0" y1="105.0" x2="142.8" y2="102.2" stroke-width="0.8" />
      <line x1="146.8" y1="118.0" x2="152.4" y2="114.7" stroke-width="1.3" />
      <line x1="154.6" y1="130.4" x2="158.4" y2="129.3" stroke-width="0.8" />
    </g>

    <!-- Axe vertical royal -->
    <line x1="100" y1="26" x2="100" y2="264" stroke="#ffe588" stroke-opacity="0.34" stroke-width="1.2" />
  </g>

  <!-- Double bordure or brossé -->
  <rect x="13" y="13" width="174" height="264" rx="11" stroke="url(#nj-cb-gold)" stroke-width="3.2" />
  <rect x="20" y="20" width="160" height="250" rx="7" stroke="#ffe794" stroke-opacity="0.44" stroke-width="1" />

  <!-- 4 médaillons d'angle sertis des 4 enseignes -->
  <g>
    <circle cx="33" cy="34" r="11" fill="#180c06" stroke="#ffd864" stroke-width="1.3" />
    <text x="33" y="39" text-anchor="middle" font-size="13" font-family="Georgia, serif" fill="#fff0a8">♠</text>
    <circle cx="167" cy="34" r="11" fill="#180c06" stroke="#ffd864" stroke-width="1.3" />
    <text x="167" y="39" text-anchor="middle" font-size="13" font-family="Georgia, serif" fill="#ff9eb2">♥</text>
    <circle cx="33" cy="256" r="11" fill="#180c06" stroke="#ffd864" stroke-width="1.3" />
    <text x="33" y="261" text-anchor="middle" font-size="13" font-family="Georgia, serif" fill="#ff9eb2">♦</text>
    <circle cx="167" cy="256" r="11" fill="#180c06" stroke="#ffd864" stroke-width="1.3" />
    <text x="167" y="261" text-anchor="middle" font-size="13" font-family="Georgia, serif" fill="#fff0a8">♣</text>
  </g>

  <!-- Boussole solaire effilée centrale -->
  <circle cx="100" cy="145" r="36" fill="#160b06" stroke="url(#nj-cb-gold)" stroke-width="2.8" />
  <polygon points="100,88 109,136 146,145 109,154 100,202 91,154 54,145 91,136" fill="url(#nj-cb-gold)" />
  <polygon points="100,120 116,129 125,145 116,161 100,170 84,161 75,145 84,129" stroke="#fff7cf" stroke-opacity="0.7" stroke-width="1.2" />
  <circle cx="100" cy="145" r="9" fill="#190c06" stroke="#fff5bf" stroke-width="2" />
  <circle cx="100" cy="145" r="4" fill="#fffbe0" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 290" fill="none">
  <defs>
    <clipPath id="nj-cb-clip">
      <rect x="13" y="13" width="174" height="264" rx="11" />
    </clipPath>

    <radialGradient id="nj-cb-bg" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#693812" />
      <stop offset="44%" stop-color="#221109" />
      <stop offset="100%" stop-color="#090504" />
    </radialGradient>

    <radialGradient id="nj-cb-glow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#ffe77d" stop-opacity="0.64" />
      <stop offset="58%" stop-color="#ffba30" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="nj-cb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6c4" />
      <stop offset="42%" stop-color="#ffcf40" />
      <stop offset="100%" stop-color="#b5670b" />
    </linearGradient>
  </defs>

  <!-- Cadre ivoire lumineux + liséré ébène -->
  <rect width="200" height="290" rx="16" fill="#fff7e2" />
  <rect x="6" y="6" width="188" height="278" rx="13" fill="#130a06" />
  <rect x="13" y="13" width="174" height="264" rx="11" fill="url(#nj-cb-bg)" />

  <!-- Cœur solaire, 16 rayons et anneaux gradués d'astrolabe -->

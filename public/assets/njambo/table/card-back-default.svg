    <rect x="13" y="13" width="174" height="264" fill="url(#nj-cb-glow)" />

    <g stroke="#ffe999" stroke-linecap="round">
      <line x1="100" y1="145" x2="190.0" y2="145.0" stroke-width="1.6" opacity="0.34" />
      <line x1="100" y1="145" x2="183.1" y2="194.7" stroke-width="0.75" opacity="0.18" />
      <line x1="100" y1="145" x2="163.6" y2="236.9" stroke-width="0.75" opacity="0.18" />
      <line x1="100" y1="145" x2="134.4" y2="265.1" stroke-width="0.75" opacity="0.18" />
      <line x1="100" y1="145" x2="100.0" y2="275.0" stroke-width="1.6" opacity="0.34" />
      <line x1="100" y1="145" x2="65.6" y2="265.1" stroke-width="0.75" opacity="0.18" />
      <line x1="100" y1="145" x2="36.4" y2="236.9" stroke-width="0.75" opacity="0.18" />
      <line x1="100" y1="145" x2="16.9" y2="194.7" stroke-width="0.75" opacity="0.18" />
      <line x1="100" y1="145" x2="10.0" y2="145.0" stroke-width="1.6" opacity="0.34" />
      <line x1="100" y1="145" x2="16.9" y2="95.3" stroke-width="0.75" opacity="0.18" />
      <line x1="100" y1="145" x2="36.4" y2="53.1" stroke-width="0.75" opacity="0.18" />
      <line x1="100" y1="145" x2="65.6" y2="24.9" stroke-width="0.75" opacity="0.18" />
      <line x1="100" y1="145" x2="100.0" y2="15.0" stroke-width="1.6" opacity="0.34" />
      <line x1="100" y1="145" x2="134.4" y2="24.9" stroke-width="0.75" opacity="0.18" />
      <line x1="100" y1="145" x2="163.6" y2="53.1" stroke-width="0.75" opacity="0.18" />
      <line x1="100" y1="145" x2="183.1" y2="95.3" stroke-width="0.75" opacity="0.18" />
    </g>

